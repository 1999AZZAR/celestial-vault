<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#E8E0D0"/>
  <!-- Archival Framing -->
  <rect x="36" y="36" width="440" height="440" rx="16" fill="none" stroke="#2A2520" stroke-width="6"/>
  <rect x="54" y="54" width="404" height="404" rx="8" fill="none" stroke="#7A7068" stroke-width="2.5"/>
  <!-- Astrolabe Celestial Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2A2520" stroke-width="5"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#7A7068" stroke-width="2.5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#7A7068" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Crosshair Reticle -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#7A7068" stroke-width="2" stroke-dasharray="8 10"/>
  <line x1="90" y1="256" x2="422" y2="256" stroke="#7A7068" stroke-width="2" stroke-dasharray="8 10"/>
  <!-- Tilted Ecliptic Ellipse -->
  <ellipse cx="256" cy="256" rx="150" ry="104" fill="none" stroke="#8B1A1A" stroke-width="3" transform="rotate(-23.4 256 256)"/>
  <!-- Constellation Asterism -->
  <polyline points="180,202 228,172 300,198 336,280 272,328 208,306 180,202" fill="none" stroke="#2A2520" stroke-width="4"/>
  <circle cx="180" cy="202" r="9" fill="#8B1A1A"/>
  <circle cx="228" cy="172" r="8" fill="#2A2520"/>
  <circle cx="300" cy="198" r="12" fill="#8B1A1A"/>
  <circle cx="336" cy="280" r="8" fill="#2A2520"/>
  <circle cx="272" cy="328" r="9" fill="#8B1A1A"/>
  <circle cx="208" cy="306" r="7" fill="#2A2520"/>
  <!-- Star Diffraction Spikes on Alpha Star -->
  <line x1="278" y1="198" x2="322" y2="198" stroke="#8B1A1A" stroke-width="2"/>
  <line x1="300" y1="176" x2="300" y2="220" stroke="#8B1A1A" stroke-width="2"/>
</svg>
