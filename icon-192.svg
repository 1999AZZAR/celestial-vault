<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="24" fill="#E8E0D0"/>
  <!-- Archival Framing -->
  <rect x="14" y="14" width="164" height="164" rx="8" fill="none" stroke="#2A2520" stroke-width="2.5"/>
  <rect x="22" y="22" width="148" height="148" rx="4" fill="none" stroke="#7A7068" stroke-width="1"/>
  <!-- Astrolabe Celestial Rings -->
  <circle cx="96" cy="96" r="58" fill="none" stroke="#2A2520" stroke-width="2"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="#7A7068" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="96" cy="96" r="28" fill="none" stroke="#7A7068" stroke-width="0.75" stroke-dasharray="2 3"/>
  <!-- Crosshair Reticle -->
  <line x1="96" y1="34" x2="96" y2="158" stroke="#7A7068" stroke-width="0.75" stroke-dasharray="3 4"/>
  <line x1="34" y1="96" x2="158" y2="96" stroke="#7A7068" stroke-width="0.75" stroke-dasharray="3 4"/>
  <!-- Tilted Ecliptic Ellipse -->
  <ellipse cx="96" cy="96" rx="55" ry="38" fill="none" stroke="#8B1A1A" stroke-width="1.2" transform="rotate(-23.4 96 96)"/>
  <!-- Constellation Asterism -->
  <polyline points="68,76 86,64 112,74 126,104 102,122 78,114 68,76" fill="none" stroke="#2A2520" stroke-width="1.5"/>
  <circle cx="68" cy="76" r="3.5" fill="#8B1A1A"/>
  <circle cx="86" cy="64" r="3" fill="#2A2520"/>
  <circle cx="112" cy="74" r="4.5" fill="#8B1A1A"/>
  <circle cx="126" cy="104" r="3" fill="#2A2520"/>
  <circle cx="102" cy="122" r="3.5" fill="#8B1A1A"/>
  <circle cx="78" cy="114" r="2.5" fill="#2A2520"/>
  <!-- Star Diffraction Spikes on Alpha Star -->
  <line x1="104" y1="74" x2="120" y2="74" stroke="#8B1A1A" stroke-width="0.8"/>
  <line x1="112" y1="66" x2="112" y2="82" stroke="#8B1A1A" stroke-width="0.8"/>
</svg>
